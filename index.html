<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invisible 80s Rhythm Keyboard</title>
  <style>
    /* --- SYNTHWAVE AESTHETIC CSS --- */
    :root {
      --neon-cyan: #00f3ff;
      --neon-pink: #ff00e5;
      --neon-green: #39ff14;
      --bg-dark: #0a0a12;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Courier New', Courier, monospace;
      /* Deep 80s gradient background */
      background: linear-gradient(135deg, #050510 0%, #1a0b2e 50%, #050510 100%);
      color: white;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 30px 20px;
      overflow-x: hidden;
    }

    /* Grid overlay for that retro digital look */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: -1;
      pointer-events: none;
    }

    h1 {
      font-size: 2.5rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 10px;
      /* Neon Pink Glow */
      color: #fff;
      text-shadow: 
        0 0 5px #fff,
        0 0 10px #fff,
        0 0 20px var(--neon-pink),
        0 0 40px var(--neon-pink),
        0 0 80px var(--neon-pink);
    }

    p.subtitle {
      color: #aaa;
      font-size: 1rem;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Cyberpunk Buttons */
    button {
      background: transparent;
      border: 2px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 12px 24px;
      font-size: 1rem;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2) inset, 0 0 10px rgba(0, 243, 255, 0.2);
    }

    button:hover {
      background: var(--neon-cyan);
      color: var(--bg-dark);
      box-shadow: 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-cyan);
    }

    button:disabled {
      border-color: #555;
      color: #555;
      box-shadow: none;
      cursor: not-allowed;
      background: transparent;
    }

    #tutorialBtn {
      display: none;
      border-color: var(--neon-green);
      color: var(--neon-green);
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.2) inset, 0 0 10px rgba(57, 255, 20, 0.2);
    }

    #tutorialBtn:hover {
      background: var(--neon-green);
      color: var(--bg-dark);
      box-shadow: 0 0 20px var(--neon-green), 0 0 40px var(--neon-green);
    }

    #tutorialMessage {
      font-size: 1.2rem;
      font-weight: bold;
      height: 30px;
      margin-bottom: 20px;
      color: var(--neon-cyan);
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 8px var(--neon-cyan);
    }

    /* Screen/Monitor Wrapper */
    .canvas-container {
      position: relative;
      padding: 10px;
      background: #111;
      border-radius: 12px;
      border: 2px solid #333;
      box-shadow: 
        0 20px 50px rgba(0,0,0,0.8),
        0 0 20px rgba(0, 243, 255, 0.3) inset;
    }

    canvas {
      display: block;
      background: #000;
      border-radius: 6px;
      max-width: 100%;
      height: auto;
      /* Scanline effect over the video */
      image-rendering: pixelated; 
    }
  </style>
</head>
<body>

  <h1>Invisible Keyboard</h1>
  <p class="subtitle">AI Spatial Synthesizer & Rhythm Trainer</p>
  
  <div class="controls">
    <button id="startButton">Loading Neural Net...</button>
    <button id="tutorialBtn">▶ Boot Tutorial: Blinding Lights</button>
  </div>
  
  <div id="tutorialMessage">System Offline. Waiting to initialize.</div>
  
  <div class="canvas-container">
    <video id="webcam" autoplay playsinline style="display: none;"></video>
    <canvas id="output_canvas" width="800" height="450"></canvas> <!-- Widescreen aspect ratio -->
  </div>

  <script type="module">
    import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs";

    const video = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const startButton = document.getElementById('startButton');
    const tutorialBtn = document.getElementById('tutorialBtn');
    const tutorialMessage = document.getElementById('tutorialMessage');

    let handLandmarker = undefined;
    let audioContext = null;
    let lastVideoTime = -1;
    let synthVoices = []; 

    // --- THE SYNTHWAVE SCALE (C Minor Pentatonic) ---
    const scale = [261.63, 311.13, 349.23, 392.00, 466.16, 523.25, 622.25];

    // --- RHYTHM TUTORIAL DATA ---
    const blindingLightsSequence = [
        { key: 2, hitTime: 2000, duration: 300 }, // F4
        { key: 2, hitTime: 2600, duration: 150 }, // F4
        { key: 1, hitTime: 2800, duration: 150 }, // Eb4
        { key: 2, hitTime: 3000, duration: 300 }, // F4
        { key: 3, hitTime: 3600, duration: 150 }, // G4
        { key: 5, hitTime: 3800, duration: 400 }, // C5
        
        { key: 2, hitTime: 4600, duration: 300 }, // F4
        { key: 2, hitTime: 5200, duration: 150 }, // F4
        { key: 1, hitTime: 5400, duration: 150 }, // Eb4
        { key: 2, hitTime: 5600, duration: 300 }, // F4
        { key: 3, hitTime: 6200, duration: 150 }, // G4
        { key: 5, hitTime: 6400, duration: 400 }, // C5
    ];

    let isTutorialPlaying = false;
    let tutorialStartTime = 0;
    const fallTimeMs = 2000; 

    async function setupModel() {
      const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2 
      });
      startButton.innerText = "Initialize System";
      tutorialMessage.innerText = "Ready. Camera access required.";
    }
    
    setupModel();

    function setupAudio() {
      if (audioContext) return; 
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      
      let synthFilter = audioContext.createBiquadFilter();
      synthFilter.type = 'lowpass';
      synthFilter.frequency.value = 1500; 
      synthFilter.connect(audioContext.destination);

      for(let hand = 0; hand < 2; hand++) {
        let voice = { oscillators: [], gains: [] };
        for(let i = 0; i < 2; i++) {
          let osc = audioContext.createOscillator();
          osc.type = 'sawtooth';
          let gain = audioContext.createGain();
          gain.gain.value = 0;
          osc.connect(gain);
          gain.connect(synthFilter);
          osc.start();
          voice.oscillators.push(osc);
          voice.gains.push(gain);
        }
        synthVoices.push(voice);
      }
    }

    startButton.addEventListener('click', async () => {
      if (!handLandmarker) return;
      setupAudio();
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        video.addEventListener("loadeddata", predictWebcam);
        
        startButton.style.display = "none";
        tutorialBtn.style.display = "inline-block"; 
        tutorialMessage.innerText = "Free Play Active. Pinch to generate sound.";
      } catch (err) {
        tutorialMessage.innerText = "Error: Camera access denied.";
        tutorialMessage.style.color = "#ff00e5"; // Pink error color
      }
    });

    tutorialBtn.addEventListener('click', () => {
        isTutorialPlaying = true;
        tutorialStartTime = performance.now();
        tutorialMessage.innerText = "Sequence initiated. Follow the blocks.";
    });

    async function predictWebcam() {
      // Keep canvas resolution matching the video aspect ratio
      canvasElement.style.width = "100%";
      canvasElement.style.height = "auto";
      
      let startTimeMs = performance.now();
      
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = handLandmarker.detectForVideo(video, startTimeMs);
        
        // Draw video background with a slight dark overlay to make neon colors pop
        canvasCtx.save();
        canvasCtx.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.fillStyle = "rgba(0, 0, 0, 0.4)";
        canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.restore();
        
        const keyWidth = canvasElement.width / scale.length;
        const hitZoneY = canvasElement.height * 0.85;

        // 1. Draw standard background key dividers (Cyberpunk Cyan)
        for(let i = 0; i < scale.length; i++) {
          canvasCtx.beginPath();
          canvasCtx.moveTo(i * keyWidth, 0);
          canvasCtx.lineTo(i * keyWidth, canvasElement.height);
          canvasCtx.strokeStyle = "rgba(0, 243, 255, 0.15)";
          canvasCtx.lineWidth = 1;
          canvasCtx.stroke();
        }

        // 2. Rhythm Tutorial Graphics
        if (isTutorialPlaying) {
            let elapsedTime = performance.now() - tutorialStartTime;

            // Hit Line
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, hitZoneY);
            canvasCtx.lineTo(canvasElement.width, hitZoneY);
            canvasCtx.strokeStyle = "rgba(57, 255, 20, 0.8)";
            canvasCtx.lineWidth = 3;
            canvasCtx.stroke();

            let allNotesCompleted = true;

            blindingLightsSequence.forEach(note => {
                let timeUntilHit = note.hitTime - elapsedTime;
                let isCurrentlyHitting = timeUntilHit <= 0 && timeUntilHit >= -note.duration;

                if (timeUntilHit > -note.duration) allNotesCompleted = false;

                if (timeUntilHit < fallTimeMs && timeUntilHit > -note.duration) {
                    let yPos = hitZoneY - ((timeUntilHit / fallTimeMs) * hitZoneY);
                    let blockHeight = (note.duration / fallTimeMs) * hitZoneY;
                    
                    // Falling block (Neon Pink)
                    canvasCtx.fillStyle = "rgba(255, 0, 229, 0.8)";
                    canvasCtx.shadowBlur = 10;
                    canvasCtx.shadowColor = "#ff00e5";
                    canvasCtx.fillRect((note.key * keyWidth) + 5, yPos - blockHeight, keyWidth - 10, blockHeight);
                    canvasCtx.shadowBlur = 0; // Reset
                }

                if (isCurrentlyHitting) {
                    canvasCtx.fillStyle = "rgba(57, 255, 20, 0.2)";
                    canvasCtx.fillRect(note.key * keyWidth, 0, keyWidth, canvasElement.height);
                }
            });

            if (allNotesCompleted && elapsedTime > 7000) {
                isTutorialPlaying = false;
                tutorialMessage.innerText = "Tutorial Complete. Free Play Active.";
            }
        }

        // 3. Audio & Hand Tracking Logic
        let handsPinchingThisFrame = [false, false];

        if (results.landmarks && results.landmarks.length > 0) {
          for(let h = 0; h < results.landmarks.length; h++) {
            if (h >= 2) break; 

            const hand = results.landmarks[h];
            const indexTip = hand[8];
            const thumbTip = hand[4];
            const x = indexTip.x; 
            
            const reversedX = 1 - x; 
            const noteIndex = Math.floor(reversedX * scale.length);
            const safeIndex = Math.max(0, Math.min(noteIndex, scale.length - 1));
            const targetFrequency = scale[safeIndex]; 
            
            const dx = indexTip.x - thumbTip.x;
            const dy = indexTip.y - thumbTip.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const isPinching = distance < 0.08;

            if (isPinching) {
              handsPinchingThisFrame[h] = true;
              let voice = synthVoices[h];
              
              for(let i = 0; i < 2; i++) {
                const pitchShift = i === 1 ? 3 : 0; 
                voice.oscillators[i].frequency.setTargetAtTime(targetFrequency + pitchShift, audioContext.currentTime, 0.01);
                voice.gains[i].gain.setTargetAtTime(0.3, audioContext.currentTime, 0.01); 
              }
              
              // Active Key Glow
              canvasCtx.fillStyle = "rgba(0, 243, 255, 0.2)";
              canvasCtx.fillRect(safeIndex * keyWidth, 0, keyWidth, canvasElement.height);
            }
            
            // Draw Hand Dot (Neon Cyan)
            canvasCtx.beginPath();
            canvasCtx.arc(x * canvasElement.width, indexTip.y * canvasElement.height, isPinching ? 16 : 10, 0, 2 * Math.PI);
            canvasCtx.fillStyle = isPinching ? "#00f3ff" : "white"; 
            canvasCtx.shadowBlur = isPinching ? 20 : 0;
            canvasCtx.shadowColor = "#00f3ff";
            canvasCtx.fill();
            canvasCtx.shadowBlur = 0;
          }
        }

        for(let h = 0; h < 2; h++) {
          if (!handsPinchingThisFrame[h]) {
            let voice = synthVoices[h];
            for(let i = 0; i < 2; i++) {
               voice.gains[i].gain.setTargetAtTime(0, audioContext.currentTime, 0.1);
            }
          }
        }
      }
      window.requestAnimationFrame(predictWebcam);
    }
  </script>
</body>
</html>
